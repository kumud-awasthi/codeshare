<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Mesh Control Plane</title>
  <link rel="stylesheet" href="/static/styles.css?v=4" />
</head>
<body>
  <header class="topbar">
    <div class="brand" data-route="command">
      <svg width="26" height="26" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2"><circle cx="16" cy="6" r="3"/><circle cx="6" cy="24" r="3"/><circle cx="26" cy="24" r="3"/><circle cx="16" cy="17" r="3" fill="#ff6a3d" stroke="#ff6a3d"/><path d="M16 9v5M8.5 22.5l5-4M23.5 22.5l-5-4"/></g></svg>
      <span>Data Mesh Control Plane</span>
    </div>
    <nav class="mainnav" id="mainnav">
      <a data-route="home">Home</a>
      <a data-route="discover">Discover</a>
      <a data-route="topology">Mesh Topology</a>
      <a data-route="build">Build</a>
      <a data-route="operate">Operate</a>
      <a data-route="manage">Manage</a>
    </nav>
    <div class="topright">
      <div class="globalsearch"><input id="globalSearch" placeholder="Search data products, domains, glossary" /></div>
      <button class="iconbtn" id="notifBtn" title="Notifications">&#128276;<span class="badge" id="notifBadge">0</span></button>
      <span class="user" id="userName">user</span>
      <button class="iconbtn" id="helpBtn" title="Help">?</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidepanel">
      <nav id="sideNav" class="sidenav hidden"></nav>
      <div class="panelgroup">
        <div class="panelhead">Environment</div>
        <ul id="envList" class="selectlist"></ul>
      </div>
      <div class="panelgroup">
        <div class="panelhead">Region</div>
        <ul id="regionList" class="selectlist"></ul>
      </div>
      <div class="panelgroup">
        <div class="panelhead">State Source</div>
        <ul id="sourceList" class="selectlist"></ul>
      </div>
      <div class="panelfoot" id="stateFoot">Connecting to Lakebase...</div>
    </aside>
    <main id="view" class="view"><div class="loading">Loading control plane...</div></main>
  </div>

  <div id="drawer" class="drawer hidden"><div class="drawerinner"><button class="close" id="drawerClose">&times;</button><div id="drawerBody"></div></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js?v=4"></script>
</body>
</html>
